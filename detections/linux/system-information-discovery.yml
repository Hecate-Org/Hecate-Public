title: Linux System Information Discovery With Uname
id: 3c3122c7-3cdf-5dee-a76b-fab92b90f9e1
status: experimental
description: A low-specificity Linux hunting building block. This behavior is also
  routine administration; a match alone does not establish malicious activity. Validate
  local telemetry and combine with context before alerting.
references:
- https://github.com/Hecate-Org/Hecate-Runner/blob/main/src/hecate_runner/bas/approved.py
author: Hecate contributors
date: '2026-10-31'
tags:
- attack.discovery
- attack.t1082
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: /uname
    CommandLine|contains: ' -a'
  condition: selection
falsepositives:
- Asset inventory and troubleshooting
- Software and kernel compatibility checks
level: low

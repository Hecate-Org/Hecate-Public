title: Detection of Malicious Cron Persistence via CVE-2024-3400 Exploitation
id: 74090a55-0328-4796-bc85-dd61a2263f70
status: experimental
description: Detects the creation or modification of files in /etc/cron.d/ by web gateway processes, indicating
  potential persistence established through the exploitation of Palo Alto Networks PAN-OS GlobalProtect
  Command Injection (CVE-2024-3400). Adversaries use this technique to schedule regular downloads of secondary
  payloads like the UPSTYLE backdoor.
references:
- https://security.paloaltonetworks.com/CVE-2024-3400
author: hecate (auto-generated draft - requires analyst review)
date: '2026-11-09'
tags:
- attack.t1105
logsource:
  category: file_event
detection:
  selection_cron:
    TargetFilename|startswith: /etc/cron.d/
  condition: selection_cron
falsepositives:
- Legitimate system administration scripts modifying cron jobs
- Automated configuration management tools (e.g., Ansible, Puppet) running as root or via web interfaces
level: high
hunt_id: H-0028
hecate_review:
  verdict: keep

description: Detects the execution of commands used to disable manufacturer-specific anti-root guards
  (riskdetect, oplus_secure_guard_new) on OnePlus devices, a key step in the CVE-2026-64560 PoC for achieving
  persistent root access via KernelSU.
references:
- https://github.com/Yunnijian/OnePlus16-Jailbreak

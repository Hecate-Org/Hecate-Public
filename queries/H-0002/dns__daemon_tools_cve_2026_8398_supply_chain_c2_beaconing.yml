title: DAEMON Tools Lite Supply Chain Compromise C2 Domain Beaconing
id: a2e41180-87a1-432d-9eb5-8e11a2f64791
status: experimental
description: Detects DNS queries resolving the primary command and control (C2) domain associated with the trojanized DAEMON Tools Lite supply chain compromise (CVE-2026-8398).
references:
- https://vulncheck.com/cve/CVE-2026-8398
- https://nvd.nist.gov/vuln/detail/CVE-2026-8398
author: hecate (grounded rerun)
date: '2026-11-02'
tags:
- attack.t1195.002
- attack.t1071.001
logsource:
  category: dns
  product: windows
detection:
  selection:
    query:
    - env-check.daemontools.cc
  condition: selection
falsepositives:
- Unknown. This domain was registered specifically by threat actors to mimic vendor update infrastructure.
level: critical
hunt_id: H-0002
hecate_review:
  verdict: keep

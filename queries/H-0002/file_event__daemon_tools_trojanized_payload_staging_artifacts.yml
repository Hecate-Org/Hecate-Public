title: DAEMON Tools Lite Supply Chain Compromise Dropped Staging Artifacts
id: f38b91a0-1287-43cf-bc01-e2448375109b
status: experimental
description: Detects file creation or hash match of reconnaissance and staging artifacts (envchk.exe, cdg.exe, core.tmp) deployed following the installation of trojanized DAEMON Tools Lite software builds (CVE-2026-8398).
references:
- https://vulncheck.com/cve/CVE-2026-8398
author: hecate (grounded rerun)
date: '2026-11-02'
tags:
- attack.t1195.002
- attack.t1105
logsource:
  category: file_event
  product: windows
detection:
  selection_filename:
    TargetFilename|endswith:
    - \envchk.exe
    - \cdg.exe
    - \cdg.tmp
    - \mcrypto.chiper
    - \mcrypto.dat
  selection_hashes:
    Hashes|contains:
    - a916e56121212613d17932e124b68752c9312e73bde8f2351054bd64394257df
    - 12edcaafab7703d0819b1395f45c35e3083dd83fb8b128292cb11033453fb6e8
  condition: selection_filename or selection_hashes
falsepositives:
- None known.
level: high
hunt_id: H-0002
hecate_review:
  verdict: keep

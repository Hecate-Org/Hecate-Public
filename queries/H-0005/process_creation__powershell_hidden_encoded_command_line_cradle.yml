title: PowerShell Hidden or Encoded Web Download Cradle Execution
id: b501d29e-6481-488f-9a18-d7b105a2e998
status: experimental
description: Detects PowerShell running with flags suppressing window display (-w hidden, -windowstyle hidden) or encoded execution combined with web request indicators.
references:
- https://attack.mitre.org/techniques/T1059/001/
- https://attack.mitre.org/techniques/T1027/
author: hecate (grounded rerun)
date: '2026-11-02'
tags:
- attack.t1059.001
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_proc:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  selection_flags:
    CommandLine|contains:
    - '-w hidden'
    - '-windowstyle hidden'
    - '-window hidden'
    - '-enc '
    - '-encodedcommand '
  selection_transfer:
    CommandLine|contains:
    - 'http://'
    - 'https://'
    - 'WebClient'
    - 'Download'
    - 'irm '
    - 'iwr '
  condition: selection_proc and selection_flags and selection_transfer
falsepositives:
- Rare administrative tasks executed hidden via Windows Task Scheduler.
level: high
hunt_id: H-0005
hecate_review:
  verdict: keep

title: GPUStack Service Spawning Shell Process
id: 89b9c8e8-43f6-5676-c56e-b6d94edf82ef
status: experimental
description: Detects GPUStack service process spawning interactive shell interpreters. Following exploitation of CVE-2026-102895 via the inference backends endpoint, attackers may execute arbitrary commands, causing the server process to spawn child shell interpreters like sh, bash, or dash.
references:
- https://nvd.nist.gov/vuln/detail/CVE-2026-102895
author: hecate
date: '2026-11-11'
tags:
- attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    ParentImage|contains:
    - gpustack
    - /gpustack
  selection_child:
    Image|endswith:
    - /bin/sh
    - /bin/bash
    - /bin/dash
  condition: selection_parent and selection_child
falsepositives:
- Legitimate administrative scripts or container entrypoint wrappers
level: high
hunt_id: H-0033

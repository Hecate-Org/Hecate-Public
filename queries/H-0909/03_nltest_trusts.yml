title: Domain Trust Enumeration With Nltest
id: 03b2cd5c-9dfe-5908-9526-da0451d34dfb
status: experimental
description: Common administration can match. Escalate with script ancestry, rare
  user/host context or rule 01/02 sequence, not enumeration alone.
author: Hecate analyst curation
date: '2026-10-29'
references:
- https://redcanary.com/threat-detection-report/threats/socgholish/
tags:

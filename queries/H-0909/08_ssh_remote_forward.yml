title: OpenSSH Client Uses Remote Forwarding
id: c450d2b5-f03e-55ff-a511-abd316ec1931
status: experimental
description: Authorized remote forwarding can match. Supports spaced and attached
  -R argument forms, but misses custom clients/renaming. Correlate task ancestry and
  destination ownership; never attribute from this flag alone.
author: Hecate analyst curation
date: '2026-10-29'
references:
- https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/socgholishs-intrusion-techniques-facilitate-distribution-of-rans
tags:
- attack.t1572
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \ssh.exe
    CommandLine|contains: ' -R'
  condition: selection
falsepositives:
- Authorized administration, software deployment or user activity; evaluate device/user/process
  context and baseline.
level: medium
hunt_id: H-0909

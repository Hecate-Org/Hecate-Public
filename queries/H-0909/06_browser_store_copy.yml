title: Command Shell Or PowerShell Copies Browser Login Store
id: df90e867-176d-5555-9af2-8a86bf0453b7
status: experimental
description: Narrow process-command candidate; profile migration/backup can match.
  Does not observe direct file reads, successful decryption or all browsers. Review
  EDR file-access telemetry where available.
author: Hecate analyst curation
date: '2026-10-29'
references:
- https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/socgholishs-intrusion-techniques-facilitate-distribution-of-rans
tags:
- attack.t1555.003
logsource:
  product: windows
  category: process_creation
detection:
  process:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
  verb:
    CommandLine|contains:
    - 'copy '
    - Copy-Item
    - 'cp '
  store:
    CommandLine|contains:
    - \Google\Chrome\User Data\
    - \Microsoft\Edge\User Data\
  login:
    CommandLine|contains: Login Data
  condition: process and verb and store and login
falsepositives:
- Authorized administration, software deployment or user activity; evaluate device/user/process
  context and baseline.
level: medium
hunt_id: H-0909

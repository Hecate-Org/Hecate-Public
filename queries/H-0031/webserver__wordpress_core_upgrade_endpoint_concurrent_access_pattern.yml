title: WordPress Core Upgrade Endpoint Concurrent Access Pattern
id: 3a97f392-41f1-45ba-93dd-e3a5efd235e5
status: experimental
description: Detects multiple rapid requests to WordPress upgrade endpoints from the same source IP within
  a short time window, consistent with CVE-2026-119977 TOCTOU race condition exploitation attempts. Attackers
  exploit predictable staging paths during WordPress core upgrades by sending concurrent requests to win
  the race condition and achieve remote code execution.
references:
- https://nvd.nist.gov/vuln/detail/CVE-2026-119977
author: hecate (reviewed)
date: '2026-11-09'
tags:
- attack.t1190
- attack.t1059.006
logsource:
  category: webserver
detection:
  selection_upgrade_endpoints:
    cs-uri-stem|contains:
    - /wp-admin/update-core.php
    - /wp-content/upgrade/
  condition: selection_upgrade_endpoints
falsepositives:
- Legitimate WordPress administrators performing manual core upgrades with browser refresh or retry behavior
- Automated WordPress management tools or plugins that poll upgrade status
- Load balancers or proxies that may cause request duplication during upgrade operations
level: high
hunt_id: H-0031
hecate_review:
  verdict: keep

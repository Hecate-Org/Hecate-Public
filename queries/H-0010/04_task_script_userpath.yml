title: Scheduled Task Action Runs Script Or Python From User Writable Path
id: baa1fa85-17b1-5710-9980-617cb166db47
status: experimental
description: 'Requires TaskContent XML and task auditing. The string/path predicates
  can occur in different XML elements: inspect Action manually. Misses COM handlers,
  SYSTEM ProgramData-only paths and renamed binary-only actions.'
author: Hecate analyst curation
date: '2026-10-29'
references:
- https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/socgholishs-intrusion-techniques-facilitate-distribution-of-rans
tags:
- attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  event:
    EventID:
    - 4698
    - 4702
  action:
    TaskContent|contains:
    - wscript
    - cscript
    - python
    - .js
  location:
    TaskContent|contains:
    - \AppData\
    - \Downloads\
    - \Temp\
  condition: event and action and location
falsepositives:
- Authorized administration, software deployment or user activity; evaluate device/user/process
  context and baseline.
level: medium
hunt_id: H-0010

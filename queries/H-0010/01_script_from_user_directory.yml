title: Windows Script Host Executes JavaScript From User Writable Directory
id: 69249d5d-6ee8-53e4-a698-2478b413beec
status: experimental
description: Candidate execution only; inspect script provenance and parent tree.
  Covers Explorer/browser/archive ancestry without requiring one parent. Misses scripts
  outside these paths and alternative interpreters.
author: Hecate analyst curation
date: '2026-10-29'
references:
- https://redcanary.com/threat-detection-report/threats/socgholish/
tags:
- attack.t1059.007
logsource:
  product: windows
  category: process_creation
detection:
  host:
    Image|endswith:
    - \wscript.exe
    - \cscript.exe
  script:
    CommandLine|contains: .js
  location:
    CommandLine|contains:
    - \Downloads\
    - \AppData\
    - \Temp\
  condition: host and script and location
falsepositives:
- Authorized administration, software deployment or user activity; evaluate device/user/process
  context and baseline.
level: medium
hunt_id: H-0010

title: Detection of Next.js Middleware Authorization Bypass via x-middleware-subrequest Header (CVE-2025-29927)
id: 2254974f-7f9d-4839-ae56-342bf0f40898
status: experimental
description: Detects inbound HTTP requests containing the internal x-middleware-subrequest header used to bypass Next.js middleware authorization controls (CVE-2025-29927). External requests asserting this header skip authentication middleware entirely.
references:
  - https://securitylabs.datadoghq.com/articles/nextjs-middleware-auth-bypass
  - https://jfrog.com/blog/cve-2025-29927-next-js-authorization-bypass
  - https://www.zscaler.com/blogs/security-research/cve-2025-29927-next-js-middleware-authorization-bypass-flaw
author: hecate-runner orchestrator (enriched)
date: '2026-11-01'
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-headers|contains: 'x-middleware-subrequest'
  condition: selection
falsepositives:
  - Internal reverse proxy subrequests if not stripped at the edge
level: high
hunt_id: H-0006
hecate_review:
  verdict: keep

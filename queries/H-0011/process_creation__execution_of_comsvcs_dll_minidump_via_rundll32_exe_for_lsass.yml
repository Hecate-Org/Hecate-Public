title: Execution of comsvcs.dll MiniDump via rundll32.exe for LSASS Credential Access
id: 0e4226c5-aab6-4011-bbee-32f48fb9efe9
status: experimental
description: Detects the execution of rundll32.exe loading comsvcs.dll with the MiniDump argument, a common
  Living-off-the-Land Binary (LOLBAS) technique used to dump LSASS memory for credential harvesting. This
  behavior is associated with T1003.001 and T1218.011.
references: []
author: hecate (auto-generated draft - requires analyst review)
date: '2026-11-02'
tags:
- attack.t1003.001
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_rundll32:
    Image|endswith: \rundll32.exe
  selection_comsvcs:
    CommandLine|contains: comsvcs.dll
  selection_minidump:
    CommandLine|contains: MiniDump
  condition: selection_rundll32 and selection_comsvcs and selection_minidump
falsepositives:
- Legitimate system administration or troubleshooting tools that may invoke comsvcs.dll for diagnostic
  purposes.
- Automated backup or monitoring scripts utilizing process dump utilities.
